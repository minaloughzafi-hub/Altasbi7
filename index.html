<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عداد التسبيح">
<title>عداد التسبيح</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--top:#f7f7f7;--bot:#0a0a0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-flip="1"]{--top:#0a0a0a;--bot:#f7f7f7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#0a0a0a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.bg{position:fixed;inset:0;display:flex;flex-direction:column}
.bg i{flex:1;transition:background .6s}
.bg i:first-child{background:var(--top)}
.bg i:last-child{background:var(--bot)}
.app{position:relative;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 22px;color:var(--bot);transition:color .6s}
.clock{direction:ltr;text-align:left;font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.clock .sec{font-size:.58em;font-weight:500;opacity:.85}
.upper{height:50%;display:flex;flex-direction:column}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;min-height:0}
.date{font-size:18px;font-weight:400;opacity:.85;text-align:center;color:var(--bot);transition:color .6s}
.ctl{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.row{display:flex;gap:8px}
.btn{background:var(--bot);color:var(--top);border:0;outline:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap;cursor:pointer;touch-action:manipulation;transition:background .6s,color .6s}
.row .btn{flex:1;padding:8px 10px}
.btn:active{opacity:.75}
.dhikr{display:flex;align-items:center;justify-content:center;padding:0 24px;text-align:center;color:var(--bot);transition:color .6s;font-family:"Amiri","Noto Naskh Arabic","Droid Arabic Naskh","Droid Naskh",serif;font-weight:700;line-height:1.75}
.zone{position:absolute;left:0;right:0;top:50%;bottom:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation}
.circle{--d:min(72vw,36vh,320px);position:absolute;left:50%;top:75%;width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);border-radius:50%;background:var(--top);box-shadow:0 0 0 2px var(--bot);display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer;transition:background .6s,box-shadow .6s}
.circle b{width:calc(100% - 12%);height:calc(100% - 12%);border-radius:50%;background:var(--bot);color:var(--top);display:flex;align-items:center;justify-content:center;font-size:calc(var(--d) * .3);font-weight:700;font-variant-numeric:tabular-nums;transition:background .6s,color .6s;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<div class="app">
  <div class="upper">
  <header>
    <div class="ctl">
      <button class="btn" id="reset" type="button">إعادة الورد</button>
      <div class="row"><button class="btn" id="prev" type="button">السابق</button><button class="btn" id="next" type="button">التالي</button></div>
    </div>
    <div class="clock" id="clock"><span id="hm">00:00</span><span class="sec" id="sec">:00</span></div>
  </header>
  <div class="mid"><div class="date" id="date"></div><div class="dhikr" id="dhikr"></div></div>
  </div>
  <button class="zone" id="zone" type="button" aria-label="سبّح"></button>
  <div class="circle" id="circle" role="button" aria-label="العداد"><b id="num">100</b></div>
</div>
<script>
var AZ=[
"لا إله إلا الله وحده لا شريك له له الملك وله الحمد وهو على كل شيء قدير",
"اللهم صل على نبيك محمد",
"يا ذا الجلال والإكرام",
"سبحان الله والحمد لله ولا إله إلا الله والله أكبر",
"سبحان الله وبحمده",
"سبحان الله والحمد لله",
"سبحان الله وبحمده سبحان الله العظيم",
"لا حول ولا قوة إلا بالله",
"لا إله إلا أنت سبحانك إني كنت من الظالمين",
"رب إني لما أنزلت إلي من خير فقير"
];
var i=0,n=100,flip=0,ctx=null;
try{var s=JSON.parse(localStorage.getItem('tasbih-v1'));if(s&&s.v!==2&&s.i>=2)s.i++;if(s&&s.i>=0&&s.i<AZ.length&&s.n>=1&&s.n<=100){i=s.i;n=s.n;flip=s.f?1:0}}catch(e){}
function save(){try{localStorage.setItem('tasbih-v1',JSON.stringify({i:i,n:n,f:flip,v:2}))}catch(e){}}
var $=function(id){return document.getElementById(id)};
function render(){
  var t=AZ[i],el=$('dhikr');
  el.textContent=t;
  el.style.fontSize=t.length<=25?'clamp(32px,9.5vw,50px)':t.length<=45?'clamp(24px,6.6vw,34px)':'clamp(21px,5.6vw,28px)';
  $('num').textContent=n;
  document.documentElement.setAttribute('data-flip',flip);
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=flip?'#f7f7f7':'#0a0a0a';
}
function beep(){
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    [880,1175].forEach(function(f,k){
      var o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+k*.16;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.09,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+.28);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.3);
    });
  }catch(e){}
}
function tap(){
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}
  n--;
  if(n<=0){
    beep();try{navigator.vibrate&&navigator.vibrate([40,60,40])}catch(e){}
    flip=flip?0:1;i=(i+1)%AZ.length;n=100;
  }
  render();save();
  try{$('circle').animate([{transform:'scale(.95)'},{transform:'scale(1)'}],{duration:110})}catch(e){}
}
['zone','circle'].forEach(function(id){
  $(id).addEventListener('pointerdown',function(e){e.preventDefault();tap()});
  $(id).addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}});
});
$('circle').tabIndex=0;
$('reset').addEventListener('click',function(){i=0;n=100;flip=0;render();save()});
function go(d){i=(i+d+AZ.length)%AZ.length;n=100;flip=flip?0:1;render();save()}
$('prev').addEventListener('click',function(){go(-1)});
$('next').addEventListener('click',function(){go(1)});
function clock(){
  var d=new Date(),p=function(x){return String(x).padStart(2,'0')};
  $('hm').textContent=p(d.getHours())+':'+p(d.getMinutes());
  $('sec').textContent=':'+p(d.getSeconds());
  var ds='';
  try{ds=d.toLocaleDateString('ar-MA',{weekday:'long',day:'numeric',month:'long'})}catch(e){ds=d.toDateString()}
  if($('date').textContent!==ds)$('date').textContent=ds;
}
clock();setInterval(clock,1000);render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
